name: Deploy website (landing + web app)

# Publishes the BuildBoard website to GitHub Pages:
#   /buildboard/      → the marketing landing page (static, site/)
#   /buildboard/app/  → the web build of the SHARED renderer (build:web)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "vite.web.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Skip postinstall (electron-rebuild) — the web build needs no native module.
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build the web app (shared renderer, base /buildboard/app/)
        run: npm run build:web
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R dist-web/. _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
