name: Deploy website (landing + web app)

# Publishes the BuildBoard website to GitHub Pages:
#   /buildboard/      → the marketing landing page (static, site/)
#   /buildboard/app/  → the legacy browser web app (built from web/)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app (base /buildboard/app/)
        run: |
          cd web
          npm ci
          npm run build
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R web/dist/. _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
