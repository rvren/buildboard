name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Gate (lint + build)
        run: |
          npm run lint
          npm run build
      # Build the installers only — do NOT let electron-builder publish (its
      # GitHub publisher has left empty releases). We attach the artifacts
      # ourselves below so a release can never ship without its installers.
      # Un-notarized: electron-builder skips signing (identity:null) and our
      # build/afterPack.js applies a deterministic ad-hoc signature so the
      # arm64 (Apple Silicon) build launches after `xattr -cr`. Disable cert
      # auto-discovery so electron-builder never tries to find a real identity.
      - name: Package (dmg + zip, arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: List artifacts
        run: ls -lh dist/*.dmg dist/*.zip
      - name: Verify arm64 app is ad-hoc signed
        run: |
          APP=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" | head -1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -i "Signature=adhoc" && echo "OK: ad-hoc signed"
      - name: Publish GitHub Release with installers
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
